# Pipeline de QA — Ejercicio 4
#
# Corre los ejercicios 1, 2 y 3 en cada push y cada pull request, y publica un
# reporte consolidado.
#
# El Ejercicio 1 evalúa contra un LLM real, así que necesita el secret
# GROQ_API_KEY configurado en el repositorio.
#
# Sobre el orden de los jobs: el enunciado pide Web -> API -> Chatbot/LLM y eso
# es lo que se respeta. Técnicamente convendría el inverso (la API es la más
# rápida y barata, así que fallar ahí primero ahorra minutos de runner), pero en
# una prueba técnica se sigue la especificación y se documenta la observación.
#
# El job de consolidación lleva `if: always()`, así que el reporte se genera
# aunque alguno de los tres jobs de pruebas haya fallado — que es justo cuando
# más se necesita.
#
# Lo que NO llevan los jobs de pruebas es `continue-on-error`. Lo tuvieron, y
# fue un error: con esa bandera un job en rojo no tumba la ejecución, así que el
# pipeline se reportaba en verde con el Ejercicio 1 fallando. `if: always()` ya
# garantiza el reporte sin enmascarar nada.

name: QA — Prueba Técnica

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  API_BASE_URL: https://goal-tracker-api.onrender.com
  CHATBOT_URL: https://botpress.com/docs

jobs:
  # ---------------------------------------------------------------- 1. Web
  web:
    name: Ejercicio 3 — Chatbot Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ejercicio-2-3-playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ejercicio-2-3-playwright/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Partir de una salida limpia
        # Se subirá output/ completo, así que tiene que contener SOLO lo que
        # produzca este job. El checkout trae los resultados de la corrida real
        # ya commiteados y, sin esta limpieza, cada job los volvería a subir: al
        # fusionar los artefactos el último en copiarse sobrescribiría lo que
        # generaron los demás con archivos que ni siquiera tocó.
        run: rm -rf ../output && mkdir -p ../output

      - name: Pruebas de interfaz
        run: npm run test:ui

      - name: Guardar resultados
        if: always()
        # Se sube SOLO lo que este job produce, no todo output/.
        # El checkout trae los resultados ya commiteados, y si cada job subiera
        # el directorio entero, al fusionar los artefactos el último en copiarse
        # sobrescribiría lo que generaron los demás con archivos que ni siquiera
        # tocó.
        uses: actions/upload-artifact@v4
        with:
          name: resultados-web
          path: output/
          retention-days: 14

  # ---------------------------------------------------------------- 2. API
  api:
    name: Ejercicio 2 — API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ejercicio-2-3-playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ejercicio-2-3-playwright/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Partir de una salida limpia
        # Se subirá output/ completo, así que tiene que contener SOLO lo que
        # produzca este job. El checkout trae los resultados de la corrida real
        # ya commiteados y, sin esta limpieza, cada job los volvería a subir: al
        # fusionar los artefactos el último en copiarse sobrescribiría lo que
        # generaron los demás con archivos que ni siquiera tocó.
        run: rm -rf ../output && mkdir -p ../output

      - name: Despertar la API
        # Render duerme el contenedor en el plan gratuito. Se le da un empujón
        # antes de empezar para que el arranque en frío no cuente como fallo.
        run: curl -s --max-time 120 "$API_BASE_URL/api/v1/status" || true

      - name: Pruebas de API
        run: npm run test:api

      - name: Guardar resultados
        if: always()
        # Se sube SOLO lo que este job produce, no todo output/.
        # El checkout trae los resultados ya commiteados, y si cada job subiera
        # el directorio entero, al fusionar los artefactos el último en copiarse
        # sobrescribiría lo que generaron los demás con archivos que ni siquiera
        # tocó.
        uses: actions/upload-artifact@v4
        with:
          name: resultados-api
          path: output/
          retention-days: 14

  # ------------------------------------------------------------ 3. LLM
  llm:
    name: Ejercicio 1 — Evaluación LLM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ejercicio-1-llm-eval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ejercicio-1-llm-eval/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Partir de una salida limpia
        # Se subirá output/ completo, así que tiene que contener SOLO lo que
        # produzca este job. El checkout trae los resultados de la corrida real
        # ya commiteados y, sin esta limpieza, cada job los volvería a subir: al
        # fusionar los artefactos el último en copiarse sobrescribiría lo que
        # generaron los demás con archivos que ni siquiera tocó.
        run: rm -rf ../output && mkdir -p ../output

      - name: Pruebas del propio evaluador
        # Corren sin credenciales y sin red, y son la garantía de que el motor
        # sigue detectando: plantan fugas de prompt, alucinaciones, olvidos,
        # injections obedecidas, respuestas hostiles y llamadas a herramientas
        # con argumentos inventados, y exigen que las cace —además de exigir que
        # NO invente hallazgos ante respuestas correctas—.
        #
        # Van antes de la evaluación a propósito: si el evaluador está roto, no
        # tiene sentido gastar 71 llamadas al modelo.
        run: python -m pytest tests/ -v

      - name: Verificar que hay credenciales
        # Sin clave no hay nada que evaluar. Se corta aquí con un mensaje claro
        # en vez de dejar que el SDK falle más adelante con un error de red que
        # no dice qué configurar.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Falta el secret GROQ_API_KEY. Configúralo en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Evaluación conversacional
        # 71 llamadas al modelo por corrida. La caché en disco no se reutiliza
        # entre ejecuciones de CI, así que cada push evalúa de verdad.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq
          LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-oss-20b' }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'openai/gpt-oss-120b' }}
        run: python src/runner.py --todos --proveedor groq

      - name: Guardar resultados
        if: always()
        # Se sube SOLO lo que este job produce, no todo output/.
        # El checkout trae los resultados ya commiteados, y si cada job subiera
        # el directorio entero, al fusionar los artefactos el último en copiarse
        # sobrescribiría lo que generaron los demás con archivos que ni siquiera
        # tocó.
        uses: actions/upload-artifact@v4
        with:
          name: resultados-llm
          path: output/
          retention-days: 14

  # ------------------------------------------------------- 4. Consolidación
  consolidar:
    name: Ejercicio 5 — Reporte consolidado
    runs-on: ubuntu-latest
    needs: [web, api, llm]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recuperar los resultados de los tres ejercicios
        uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Unificar en output/
        # Se parte de cero: los resultados commiteados en el repositorio son la
        # evidencia de la corrida real contra un LLM, y no deben mezclarse con
        # lo que acaba de producir este pipeline.
        run: |
          rm -rf output && mkdir -p output
          for dir in artefactos/*/; do
            [ -d "$dir" ] && cp -R "$dir." output/ || true
          done
          find output -type f | sort

      - name: Generar reporte consolidado
        run: python ejercicio-5-reporte/consolidar.py --entrada output --salida output

      - name: Publicar el reporte en el resumen del job
        if: always()
        run: cat output/reporte-consolidado.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-consolidado
          path: output/
          retention-days: 30

      - name: Decidir el resultado del pipeline
        # Segunda red de seguridad, con el consolidado ya en la mano: si un
        # job de pruebas falló, la ejecución ya está en rojo por sí sola, pero
        # esto además captura casos en rojo o hallazgos críticos que hubieran
        # quedado registrados sin tumbar su job.
        run: python ejercicio-5-reporte/consolidar.py --entrada output --salida output --estricto
